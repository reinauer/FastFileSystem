name: FastFileSystem Draft Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed for creating GitHub releases

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - name: OS3 and ffs-image
            artifact: os3
            image: stefanreinauer/amiga-gcc:gcc-v16.2
            targets: amigaos3 ffs-image
          - name: OS4
            artifact: os4
            image: stefanreinauer/amiga-gcc:gcc-v16.2-ppc
            targets: amigaos4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark git directory as safe
        run: git config --global --add safe.directory '*'

      - name: Build
        run: make ${{ matrix.targets }}

      - name: Collect binaries
        run: |
          mkdir -p dist
          if [ -f build/os3/FastFileSystem ]; then cp build/os3/FastFileSystem dist/FastFileSystem.OS3; fi
          if [ -f build/os4/FastFileSystem ]; then cp build/os4/FastFileSystem dist/FastFileSystem.OS4; fi
          if [ -f build/ffs-image ]; then cp build/ffs-image dist/ffs-image; fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Create GitHub Draft Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/FastFileSystem.OS3
            artifacts/FastFileSystem.OS4
            artifacts/ffs-image
